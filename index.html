<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets the character encoding and responsive viewport for mobile devices -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Links our HTML file to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main header section of the webpage -->
    <header>
        <h1>Welcome to My Website!</h1>
        <p>Built with HTML, CSS, and JavaScript, hosted on GitHub Pages.</p>
    </header>

    <!-- Main content container -->
    <main>
        <section class="card">
            <h2>Hello, World! 👋</h2>
            <p>This is your starting template. Click the button below to see JavaScript in action!</p>
            <!-- An interactive button that triggers a JavaScript function -->
            <button id="colorBtn">Click Me!</button>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Future Developer. All rights reserved.</p>
    </footer>

    <!-- Links our HTML file to our external JavaScript script -->
    <script src="script.js"></script>
</body>
</html>
